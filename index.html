<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Is Jen Still Pregnant?</title>

    <!-- SEO Meta Tags -->
    <meta
      name="description"
      content="Check to see if the bun is still in the oven!"
    />
    <meta
      name="keywords"
      content="pregnancy, expecting, baby, family, updates"
    />
    <meta name="author" content="OJ" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Is Jen Still Pregnant?" />
    <meta
      property="og:description"
      content="Check to see if the bun is still in the oven!"
    />
    <meta property="og:site_name" content="Is Jen Still Pregnant?" />

    <link rel="shortcut icon" href="/favicon.ico" />

    <!-- Additional Meta Tags -->
    <meta name="theme-color" content="#00ff00" />
    <meta name="msapplication-TileColor" content="#00ff00" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .yes {
        background-color: #00ff00;
        color: #000000;
      }

      .no {
        background-color: #ff0000;
        color: #ffffff;
      }

      .loading {
        background-color: #ffff00;
        color: #000000;
      }

      .loading-gif {
        max-width: 80vw;
        max-height: 80vh;
        width: auto;
        height: auto;
        display: block;
      }

      .content {
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .text {
        font-size: 20vw;
        font-weight: bold;
        text-align: center;
        user-select: none;
      }

      .still {
        font-size: 3vw;
        font-weight: bold;
        text-align: center;
        user-select: none;
        display: none;
        line-height: 4vw;
      }

      .loading-text {
        font-size: 3vw;
        font-weight: bold;
        text-align: center;
        user-select: none;
        display: none;
        margin-top: 3vw;
      }

      .timestamp {
        position: fixed;
        top: 10px;
        left: 10px;
        background-color: rgba(0, 0, 0, 0.7);
        color: white;
        padding: 8px 12px;
        font-size: 14px;
        font-weight: normal;
        border-radius: 4px;
        font-family: monospace;
        z-index: 1000;
        display: none;
      }

      .meal-train {
        position: fixed;
        bottom: 10px;
        left: 10px;
        background-color: rgba(0, 0, 0, 0.7);
        color: white;
        padding: 8px 12px;
        font-size: 14px;
        font-weight: normal;
        border-radius: 4px;
        font-family: monospace;
        z-index: 1000;
        display: none;
      }

      .meal-train a {
        color: white;
        text-decoration: underline;
      }

      .more-info {
        font-size: 1.5vw;
        margin-top: 2vw;
        text-decoration: underline;
        cursor: pointer;
        display: none;
      }

      .more-info a {
        color: #ffffff;
        text-decoration: underline;
      }

      @media (max-width: 768px) {
        .more-info {
          font-size: 4vw;
        }
      }

      @media (max-width: 768px) {
        .text {
          font-size: 25vw;
        }
        .timestamp {
          font-size: 12px;
          padding: 6px 10px;
        }
        .meal-train {
          font-size: 12px;
          padding: 6px 10px;
        }
      }
    </style>
  </head>
  <body class="yes">
    <div class="content">
      <div class="text" id="text">YES</div>
      <div class="still" id="still">
        <div>Merry Christmas! 🎁</div>
        <div>
          First-time mothers tend to give birth about 5 days late
          <div>(that's today, so fingers crossed!)</div>
        </div>
      </div>
      <div class="loading-text" id="loading-text">(this means labor)</div>
      <div class="more-info" id="more-info">
        <a href="announcement.html">Click here for more info!</a>
      </div>
    </div>
    <div class="timestamp" id="timestamp">
      Last updated: {{DEPLOY_TIMESTAMP}}
    </div>
    <div class="meal-train" id="meal-train">
      Meal Train:
      <a href="https://www.mealtrain.com/trains/kyvl2r" target="_blank"
        >https://www.mealtrain.com/trains/kyvl2r</a
      >
    </div>

    <script>
      // Possible values: "yes", "loading", "no"
      const CURRENT_STATE = "no";

      function setPage() {
        const body = document.body;
        const text = document.getElementById("text");
        const timestamp = document.getElementById("timestamp");
        const mealTrain = document.getElementById("meal-train");
        const still = document.getElementById("still");
        const loadingText = document.getElementById("loading-text");
        const moreInfo = document.getElementById("more-info");

        if (CURRENT_STATE === "loading") {
          body.className = "loading";
          text.innerHTML =
            '<img src="new_life_loading.GIF" alt="Loading..." class="loading-gif">';
          timestamp.style.display = "block";
          mealTrain.style.display = "block";
          still.style.display = "none";
          loadingText.style.display = "block";
          moreInfo.style.display = "none";
        } else if (CURRENT_STATE === "no") {
          body.className = "no";
          text.textContent = "NO";
          timestamp.style.display = "block";
          mealTrain.style.display = "block";
          still.style.display = "none";
          loadingText.style.display = "none";
          moreInfo.style.display = "block";
        } else {
          body.className = "yes";
          text.textContent = "YES";
          timestamp.style.display = "block";
          mealTrain.style.display = "block";
          still.style.display = "block";
          loadingText.style.display = "none";
          moreInfo.style.display = "none";
        }
      }

      setPage();
    </script>
  </body>
</html>
